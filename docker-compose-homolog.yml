# docker-compose-homolog.yml
version: '3'

services:
  postgres:
    container_name: pizzaria_homolog_db
    image: postgres:16
    environment:
      POSTGRES_DB: pizzaria_homolog
      POSTGRES_USER: ${HOMOLOG_DB_USERNAME}
      POSTGRES_PASSWORD: ${HOMOLOG_DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - "${HOMOLOG_DB_PORT:-5432}:5432"
    networks:
      - pizzaria-homolog-network
    volumes:
      - postgres_homolog_data:/data/postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d pizzaria_homolog -U ${HOMOLOG_DB_USERNAME} || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  app:
    build: .
    container_name: pizzaria_homolog_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=homolog
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pizzaria_homolog
      - SPRING_DATASOURCE_USERNAME=${HOMOLOG_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${HOMOLOG_DB_PASSWORD}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=2
    env_file:
      - .env
    networks:
      - pizzaria-homolog-network
    ports:
      - "${HOMOLOG_SERVER_PORT}:8091"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

networks:
  pizzaria-homolog-network:
    driver: bridge

volumes:
  postgres_homolog_data: