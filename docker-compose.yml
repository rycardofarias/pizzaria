version: '3'

services:
  postgres:
    container_name: pizzaria_db
    image: postgres:16
    environment:
      POSTGRES_DB: pizzaria
      POSTGRES_USER: ${DEV_DB_USERNAME}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    networks:
      - pizzaria-network
    volumes:
      - postgres_data:/data/postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DEV_DB_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pizzaria
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    env_file:
      - .env
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      - ./logs:/app/logs
    working_dir: /app
    command: ./mvnw spring-boot:run
    networks:
      - pizzaria-network
    ports:
      - "${DEV_SERVER_PORT}:8090"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pizzaria-network:
    driver: bridge

volumes:
  postgres_data: