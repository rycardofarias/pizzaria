spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none    # Nunca alterar schema automaticamente em produção
    properties:
      hibernate:
        format_sql: false
  security:
    user:
      name: ${PROD_SECURITY_USER}
      password: ${PROD_SECURITY_PASSWORD}

server:
  port: ${PROD_SERVER_PORT}
  tomcat:
    max-threads: 200
    min-spare-threads: 20

logging:
  file:
    name: ${LOGGING_FILE_NAME}
    max-size: ${LOGGING_FILE_MAX_SIZE}
    max-history: ${LOGGING_FILE_MAX_HISTORY}
  level:
    root: ${LOGGING_LEVEL_ROOT}
    org.springframework: ${LOGGING_LEVEL_SPRING}
    org.hibernate: ${LOGGING_LEVEL_HIBERNATE}
    com.pizzaria: ${LOGGING_LEVEL_APP}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n"