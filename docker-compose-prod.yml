version: '3.8'  # Versão mais recente

services:
  postgres:
    container_name: pizzaria_prod_db
    image: postgres:16
    environment:
      POSTGRES_DB: pizzaria_prod
      POSTGRES_USER: ${PROD_DB_USERNAME}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      PGDATA: /data/postgres
    # Removida exposição da porta em produção
    networks:
      - pizzaria-prod-network
    volumes:
      - postgres_prod_data:/data/postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USERNAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  app:
    image: ${DOCKER_REGISTRY}/pizzaria-app:${APP_VERSION}  # Use imagens pré-construídas
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pizzaria_prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    env_file:
      - .env.prod  # Arquivo de ambiente específico para produção
    volumes:
      - app_logs:/app/logs  # Apenas logs persistentes
    networks:
      - pizzaria-prod-network
    ports:
      - "${PROD_SERVER_PORT}:8092"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  pizzaria-prod-network:
    driver: bridge
    name: pizzaria_prod_network
    internal: true  # Rede interna apenas

volumes:
  postgres_prod_data:
    name: pizzaria_prod_db_data
  app_logs:
    name: pizzaria_prod_app_logs